name: Level 1 C11 validation

on:
  push:
    branches: [main, "feature/l1-v0.3-memory-stability", "feature/l1-v0.4-adaptive-evaluation", "feature/l1-v0.5-risk-aware-memory"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/level1
    steps:
      - uses: actions/checkout@v4
      - name: Build and unit tests
        run: make clean all test
      - name: Assertions survive NDEBUG
        run: make test-ndebug
      - name: Deterministic replay acceptance
        run: make clean all replay
      - name: Bounded adaptive evaluation
        run: make evaluation-ci
      - name: Bounded risk-aware evaluation
        run: make evaluation-v05-ci

  sanitizers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/level1
    steps:
      - uses: actions/checkout@v4
      - name: Address and undefined-behavior sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make sanitize
      - name: Sanitizer-backed held-out evaluation smoke test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make evaluation-ci
      - name: Sanitizer-backed risk-aware held-out smoke test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make evaluation-v05-ci
