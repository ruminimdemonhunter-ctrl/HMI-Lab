name: Level 1 C11 validation

on:
  push:
    branches: [main, "feature/l1-v0.3-memory-stability", "feature/l1-v0.4-adaptive-evaluation", "feature/l1-v0.5-risk-aware-memory", "feature/l1-v0.6-outcome-feedback", "feature/l1-v0.7-workload-evidence", "feature/l1-v0.8-recorder-evidence", "feature/l1-v0.9-transparent-replay", "feature/l1-v1.0-real-psi-evidence", "feature/l1-v1.1-policy-boundary"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/level1
    steps:
      - uses: actions/checkout@v4
      - name: Build and unit tests
        run: make clean all test
      - name: Assertions survive NDEBUG
        run: make test-ndebug
      - name: Deterministic replay acceptance
        run: make clean all replay
      - name: Bounded adaptive evaluation
        run: make evaluation-ci
      - name: Bounded risk-aware evaluation
        run: make evaluation-v05-ci
      - name: Bounded outcome-aware shadow evaluation
        run: make evaluation-v06-ci
      - name: Bounded workload-evidence diagnostics
        run: make evaluation-v07-ci
      - name: Bounded recorder benchmark smoke test
        run: make recorder-bench-ci
      - name: Transparent replay acceptance smoke test
        run: make inspect-ci
      - name: Bounded transparent replay resource smoke test
        run: make inspect-bench-ci
      - name: Offline PSI evidence analyzer smoke test
        run: make evidence-ci
      - name: Bounded offline evidence resource smoke test
        run: make evidence-bench-ci
      - name: Test-only proposal boundary
        run: make proposal-ci
      - name: Bounded proposal verifier resource smoke test
        run: make proposal-bench-ci

  sanitizers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/level1
    steps:
      - uses: actions/checkout@v4
      - name: Address and undefined-behavior sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make sanitize
      - name: Sanitizer-backed held-out evaluation smoke test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make evaluation-ci
      - name: Sanitizer-backed risk-aware held-out smoke test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make evaluation-v05-ci
      - name: Sanitizer-backed outcome-aware shadow held-out smoke test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make evaluation-v06-ci
      - name: Sanitizer-backed workload-evidence diagnostics
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make evaluation-v07-ci
      - name: Sanitizer-backed recorder benchmark smoke test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make recorder-bench-ci
      - name: Sanitizer-backed transparent replay smoke test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make inspect-ci
      - name: Sanitizer-backed replay resource smoke test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make inspect-bench-ci
      - name: Sanitizer-backed PSI evidence analyzer smoke test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make evidence-ci
      - name: Sanitizer-backed evidence resource smoke test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make evidence-bench-sanitize-ci
      - name: Sanitizer-backed proposal boundary
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make proposal-ci
      - name: Sanitizer-backed proposal resource smoke test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make proposal-bench-sanitize-ci
