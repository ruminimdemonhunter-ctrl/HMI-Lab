name: Level 1 C11 validation

on:
  push:
    branches: [main, "feature/l1-v0.3-memory-stability", "feature/l1-v0.4-adaptive-evaluation", "feature/l1-v0.5-risk-aware-memory", "feature/l1-v0.6-outcome-feedback", "feature/l1-v0.7-workload-evidence", "feature/l1-v0.8-recorder-evidence", "feature/l1-v0.9-transparent-replay", "feature/l1-v1.0-real-psi-evidence", "feature/l1-v1.1-policy-boundary", "feature/l1-rc0-offline-qualification", "feature/l1-r2.1-state-classifier", "feature/l1-r2.2-operational-memory", "feature/l1-r2.3-heldout-novelty"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/level1
    steps:
      - uses: actions/checkout@v4
      - name: Integrated RC0 CI qualification
        run: make rc0-ci
      - name: Assertions survive NDEBUG
        run: make test-ndebug

  sanitizers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/level1
    steps:
      - uses: actions/checkout@v4
      - name: Address and undefined-behavior sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make sanitize
      - name: Sanitizer-backed held-out evaluation smoke test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make evaluation-ci
      - name: Sanitizer-backed risk-aware held-out smoke test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make evaluation-v05-ci
      - name: Sanitizer-backed outcome-aware shadow held-out smoke test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make evaluation-v06-ci
      - name: Sanitizer-backed workload-evidence diagnostics
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make evaluation-v07-ci
      - name: Sanitizer-backed locked R2.3 novelty evaluation
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make evaluation-r23-ci
      - name: Sanitizer-backed recorder benchmark smoke test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make recorder-bench-ci
      - name: Sanitizer-backed transparent replay smoke test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make inspect-ci
      - name: Sanitizer-backed replay resource smoke test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make inspect-bench-ci
      - name: Sanitizer-backed PSI evidence analyzer smoke test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make evidence-ci
      - name: Sanitizer-backed evidence resource smoke test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make evidence-bench-sanitize-ci
      - name: Sanitizer-backed proposal boundary
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make proposal-ci
      - name: Sanitizer-backed proposal resource smoke test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make proposal-bench-sanitize-ci
